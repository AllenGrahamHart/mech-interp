[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mech-interp-morality"
version = "0.1.0"
description = "Mechanistic interpretability experiments for Gemma 3 morality directions"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "accelerate>=1.4.0",
  "datasets>=3.3.0",
  "huggingface-hub>=0.29.0",
  "matplotlib>=3.9.0",
  "modal>=1.1.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "sae-lens>=6.0.0",
  "scikit-learn>=1.5.0",
  "sentencepiece>=0.2.0",
  "torch>=2.6.0",
  "tqdm>=4.67.0",
  "transformers>=4.51.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.11.0",
]

[project.scripts]
mech-interp = "mech_interp.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

