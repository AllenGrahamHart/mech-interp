experiment_name = "morality_direction_smoke_open"
output_root = "runs"

[model]
model_id = "Qwen/Qwen2.5-0.5B-Instruct"
hf_token_env = "HF_TOKEN"
dtype = "bfloat16"
attn_implementation = "sdpa"
device_map = "auto"
trust_remote_code = false

[dataset]
dataset_id = "hendrycks/ethics"
subset = "commonsense"
train_split = "train"
eval_split = "test"
text_field = "input"
label_field = "label"
require_short = true
limit_train_per_class = 16
limit_eval_per_class = 8
shuffle_seed = 42

[prompts]
representation_template = "Scenario: {text}\nMoral evaluation:"
judgment_template = "Scenario: {text}\nIs this morally acceptable? Answer with one word:"
positive_completion = " unacceptable"
negative_completion = " acceptable"

[activations]
layer = 12
site = "resid_post"
pooling = "last_non_pad"
batch_size = 8
max_length = 128

[stability]
enabled = true
repeats = 4
sample_sizes = [4, 8, 12, 16]
random_seed = 42

[intervention]
enabled = true
judgment_template = "Scenario: {text}\nIs this morally wrong? Answer:"
positive_token = " yes"
negative_token = " no"
add_scales = [-3.0, -1.0, 1.0, 3.0]
remove_component = true
max_examples_per_class = 8

[direction]
method = "mean_diff"
positive_label = 1
positive_name = "immoral"
negative_name = "acceptable"
normalize = true

[sae]
enabled = false
