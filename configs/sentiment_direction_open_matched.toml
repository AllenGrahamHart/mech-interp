experiment_name = "sentiment_direction_open_matched"
output_root = "runs"

[model]
model_id = "Qwen/Qwen2.5-0.5B-Instruct"
hf_token_env = "HF_TOKEN"
dtype = "bfloat16"
attn_implementation = "sdpa"
device_map = "auto"
trust_remote_code = false

[dataset]
dataset_id = "glue"
subset = "sst2"
train_split = "train"
eval_split = "validation"
text_field = "sentence"
label_field = "label"
require_short = false
limit_train_per_class = 2789
limit_eval_per_class = 428
shuffle_seed = 42

[prompts]
representation_template = "Text: {text}\nSentiment:"
judgment_template = "Text: {text}\nIs the sentiment positive or negative? Answer with one word:"
positive_completion = " positive"
negative_completion = " negative"

[activations]
layer = 15
site = "resid_post"
pooling = "last_non_pad"
batch_size = 16
max_length = 128

[stability]
enabled = true
repeats = 4
sample_sizes = [16, 32, 64, 128, 256, 512, 1024, 2048]
random_seed = 42

[intervention]
enabled = true
judgment_template = "Text: {text}\nIs the sentiment positive or negative? Answer with one word:"
positive_completion = " positive"
negative_completion = " negative"
add_scales = [-3.0, -1.0, 1.0, 3.0]
remove_component = true
max_examples_per_class = 428

[direction]
method = "mean_diff"
positive_label = 1
positive_name = "positive"
negative_name = "negative"
normalize = true

[sae]
enabled = false
